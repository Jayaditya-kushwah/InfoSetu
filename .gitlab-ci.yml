include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - format
  - lint
  - type-check
  - test
  - security

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  paths:
    - .cache/uv

.setup_uv: &setup_uv
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv sync --frozen

validate:
  <<: *setup_uv
  stage: validate
  script:
    - uv run pre-commit run check-merge-conflict --all-files
    - uv run pre-commit run check-json --all-files
    - uv run pre-commit run check-toml --all-files
    - uv run pre-commit run check-added-large-files --all-files

ruff-lint:
  <<: *setup_uv
  stage: lint
  script:
    - uv run ruff check .
  only:
    changes:
      - "**/*.py"

bandit:
  <<: *setup_uv
  stage: security
  script:
    - uv run bandit -r app/ -c pyproject.toml
  only:
    changes:
      - "**/*.py"

ruff-format:
  <<: *setup_uv
  stage: format
  script:
    - uv run ruff format --check .
  only:
    changes:
      - "**/*.py"

type-check:
  <<: *setup_uv
  stage: type-check
  script:
    - uv run pyrefly check app/ main.py
  only:
    changes:
      - "**/*.py"

pytest:
  <<: *setup_uv
  stage: test
  script:
    - uv run pytest -v --cov=. -n auto --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    changes:
      - "**/*.py"

pyupgrade:
  <<: *setup_uv
  stage: lint
  script:
    - uv run pyupgrade --py313-plus --exit-zero-even-if-changed $(find app -name "*.py")
  only:
    changes:
      - "**/*.py"
