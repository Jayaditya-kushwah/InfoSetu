# Pre-commit hooks — https://pre-commit.com
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|mjs)$

      - id: prettier
        name: prettier
        entry: npx prettier --check --ignore-unknown
        language: system
        pass_filenames: true
        files: \.(ts|tsx|js|jsx|mjs|json|css|md|yaml|yml)$

      - id: type-check
        name: type-check
        entry: npm run type-check
        language: system
        pass_filenames: false
        always_run: true

      - id: biome
        name: biome
        entry: npm run biome
        language: system
        pass_filenames: false
        always_run: true

      - id: oxlint
        name: oxlint
        entry: npm run oxlint
        language: system
        pass_filenames: false
        always_run: true
